name: Build SmartTube Head Unit

on:
  workflow_dispatch:

concurrency:
  group: smarttube-headunit
  cancel-in-progress: true

jobs:
  build:
    name: APK armeabi-v7a (headunit, R8)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build head-unit APK (armv7a, R8, debug-signed)
        run: ./gradlew :smarttubetv:assembleStbetaHeadunit --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          P=$(find smarttubetv/build/outputs/apk -name '*_armeabi-v7a*.apk' | head -1)
          echo "path=$P" >> "$GITHUB_OUTPUT"
          echo "APK: $P"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-headunit
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
